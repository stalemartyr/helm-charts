# Nginx SSH Proxy Configuration
# This configuration proxies SSH connections to backend servers

# IMPORTANT: This requires the nginx stream module
# Install with: apt-get install libnginx-mod-stream (Debian/Ubuntu)
# Or compile nginx with: --with-stream --with-stream_ssl_module

# Main stream block (add to /etc/nginx/nginx.conf or include from conf.d/)
stream {
    # Logging
    log_format ssh_proxy '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr" '
                         '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';

    access_log /var/log/nginx/ssh_access.log ssh_proxy;
    error_log /var/log/nginx/ssh_error.log;

    # Example 1: Simple SSH proxy to single backend
    upstream ssh_backend {
        server 192.168.1.100:22;  # Backend SSH server
    }

    server {
        listen 2222;               # Nginx listens on port 2222
        proxy_pass ssh_backend;    # Forward to port 22 on backend
        proxy_timeout 3600s;       # 1 hour timeout for long SSH sessions
        proxy_connect_timeout 60s;
    }

    # Example 2: Load balanced SSH across multiple servers
    upstream ssh_cluster {
        least_conn;                # Use least connections algorithm
        server 192.168.1.101:22;
        server 192.168.1.102:22;
        server 192.168.1.103:22;
    }

    server {
        listen 2223;
        proxy_pass ssh_cluster;
        proxy_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Example 3: SNI-based SSH routing (requires different hostnames)
    # Note: SSH doesn't support SNI natively, but you can use different ports
    map $server_port $ssh_target {
        2224  192.168.1.201:22;   # Port 2224 -> server 1
        2225  192.168.1.202:22;   # Port 2225 -> server 2
        2226  192.168.1.203:22;   # Port 2226 -> server 3
    }

    server {
        listen 2224;
        listen 2225;
        listen 2226;
        proxy_pass $ssh_target;
        proxy_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Example 4: Proxy to Kubernetes service
    upstream k8s_ssh {
        server 10.43.0.50:22;     # Kubernetes ClusterIP:22
    }

    server {
        listen 2227;
        proxy_pass k8s_ssh;
        proxy_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Example 5: Proxy standard SSH port 22 (requires nginx to run as root or with CAP_NET_BIND_SERVICE)
    upstream main_ssh_backend {
        server 192.168.254.5:22;
    }

    server {
        listen 22;                 # Bind to standard SSH port
        proxy_pass main_ssh_backend;
        proxy_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_socket_keepalive on;
    }

    # Example 6: With SSL/TLS termination (for SSH over TLS)
    # upstream ssh_tls_backend {
    #     server 192.168.1.100:22;
    # }
    #
    # server {
    #     listen 8443 ssl;
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     proxy_pass ssh_tls_backend;
    #     proxy_timeout 3600s;
    # }

    # Example 7: Health check with backup server
    upstream ssh_ha {
        server 192.168.1.100:22 max_fails=3 fail_timeout=30s;
        server 192.168.1.101:22 backup;  # Backup server
    }

    server {
        listen 2228;
        proxy_pass ssh_ha;
        proxy_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}

