# Nginx SSH Proxy Configuration for feworkshop.jimbertamante.com
# This proxies SSH connections to backend server

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Stream block for SSH proxy (Layer 4)
stream {
    # Logging format for SSH connections
    log_format ssh_proxy '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr"';

    access_log /var/log/nginx/ssh_access.log ssh_proxy;
    error_log /var/log/nginx/ssh_error.log info;

    # Backend SSH server
    upstream feworkshop_ssh {
        server 192.168.254.5:22;  # Replace with your backend SSH server IP
        # Or use internal Kubernetes service:
        # server feworkshop-ssh-service.default.svc.cluster.local:22;
    }

    # Option 1: Proxy on standard SSH port 22
    # Users connect: ssh user@feworkshop.jimbertamante.com
    server {
        listen 22;                      # Standard SSH port
        proxy_pass feworkshop_ssh;
        proxy_timeout 3600s;            # 1 hour timeout for long sessions
        proxy_connect_timeout 60s;      # 60 second connection timeout
        proxy_socket_keepalive on;      # Keep TCP connection alive
    }

    # Option 2: Proxy on alternate port (e.g., 2222)
    # Users connect: ssh -p 2222 user@feworkshop.jimbertamante.com
    server {
        listen 2222;
        proxy_pass feworkshop_ssh;
        proxy_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_socket_keepalive on;
    }
}

# HTTP block for web traffic (if needed)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Optional: HTTP server on port 80
    server {
        listen 80;
        server_name feworkshop.jimbertamante.com;

        # Redirect to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # Optional: HTTPS server on port 443
    # server {
    #     listen 443 ssl http2;
    #     server_name feworkshop.jimbertamante.com;
    #
    #     ssl_certificate /etc/nginx/ssl/feworkshop.crt;
    #     ssl_certificate_key /etc/nginx/ssl/feworkshop.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         root /usr/share/nginx/html;
    #         index index.html;
    #     }
    # }
}
