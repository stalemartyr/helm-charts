# Kube-Prometheus-Stack Values
# Includes: Prometheus, Grafana, Alertmanager, and various exporters
# Install with: helm install prometheus-stack prometheus-community/kube-prometheus-stack -f kube-prometheus-stack-values.yaml

# ============================================
# PROMETHEUS CONFIGURATION
# ============================================
prometheus:
  prometheusSpec:
    # Data retention period
    retention: 15d
    retentionSize: "50GB"

    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Service Monitor selectors (empty = select all)
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # Pod Monitor selectors
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 200m
        memory: 2Gi

    # Additional scrape configs (for custom targets)
    additionalScrapeConfigs: []

    # Enable admin API for management operations
    enableAdminAPI: false

    # Replicas for HA
    replicas: 1

  # Prometheus Service configuration
  service:
    type: ClusterIP
    port: 9090

# ============================================
# ALERTMANAGER CONFIGURATION
# ============================================
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 2

    # Storage for Alertmanager
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Alertmanager configuration
  config:
    global:
      smtp_smarthost: 137.184.240.106:587
      smtp_from: noreply@jimbertamante.com
      smtp_auth_username: noreply@jimbertamante.com
      smtp_auth_password: H9y4byYhH2wAgQgSs6442nHAdPQvREXg
      smtp_require_tls: true

    route:
      receiver: upclass-team-a
      repeat_interval: 5m
      group_by: ["alertname", "cluster", "service"]
      group_wait: 10s
      group_interval: 10s

      # Child routes
      routes:
        - match:
            severity: critical
          receiver: upclass-team-a
          continue: true
        - match:
            severity: warning
          receiver: upclass-team-a

    receivers:
      - name: upclass-team-a
        email_configs:
          - to: jimbertamante@gmail.com
            from: noreply@jimbertamante.com
            smarthost: 137.184.240.106:587
            auth_username: noreply@jimbertamante.com
            auth_password: H9y4byYhH2wAgQgSs6442nHAdPQvREXg
            headers:
              Subject: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
            html: |
              {{ range .Alerts }}
              <b>Alert:</b> {{ .Labels.alertname }}<br>
              <b>Severity:</b> {{ .Labels.severity }}<br>
              <b>Description:</b> {{ .Annotations.description }}<br>
              <b>Summary:</b> {{ .Annotations.summary }}<br>
              {{ end }}

# ============================================
# GRAFANA CONFIGURATION
# ============================================
grafana:
  enabled: true

  # Admin credentials
  adminPassword: St4l3M4rtyr1992

  # Service configuration
  service:
    type: LoadBalancer
    port: 80

  # Persistence for dashboards
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  initChownData:
    enabled: false
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Data sources - Prometheus is auto-configured by the chart, just add Loki
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-stack:3100
      jsonData:
        maxLines: 1000

  # Pre-installed dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Import default dashboards
  dashboards:
    default:
      prometheus-stats:
        gnetId: 2
        revision: 2
        datasource: Prometheus
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus
      loki-dashboard:
        gnetId: 13639
        revision: 2
        datasource: Loki

  # Grafana ini configuration
  #grafana.ini:
