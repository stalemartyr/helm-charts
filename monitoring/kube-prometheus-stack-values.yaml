  #    root_url: "http://localhost:3000"
  #  analytics:
  #    check_for_updates: true
  #  users:
  #    allow_sign_up: false
  #  auth.anonymous:
  #    enabled: false

# ============================================
# NODE EXPORTER
# ============================================
nodeExporter:
  enabled: true

# ============================================
# KUBE STATE METRICS
# ============================================
kubeStateMetrics:
  enabled: true

# ============================================
# PROMETHEUS OPERATOR
# ============================================
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ============================================
# NOTE: Blackbox Exporter is installed separately
# See blackbox-exporter-values.yaml
# ============================================
# DEFAULT RULES
# ============================================
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
