# Loki-Stack Values
# Includes: Loki (log aggregation) and Promtail (log collector)
# Install with: helm install loki grafana/loki-stack -f loki-stack-values.yaml

# ============================================
# LOKI CONFIGURATION
# ============================================
loki:
  enabled: true
  image:
    tag: 2.9.3

  # Loki configuration
  config:
    # Authentication
    auth_enabled: false

    # Ingester configuration
    ingester:
      chunk_idle_period: 3m
      chunk_block_size: 262144
      chunk_retain_period: 1m
      max_transfer_retries: 0
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1

    # Limits configuration
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_entries_limit_per_query: 5000
      max_query_length: 721h
      max_query_parallelism: 32
      max_streams_per_user: 0
      max_global_streams_per_user: 0
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

    # Schema configuration
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    # Server configuration
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    # Storage configuration
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/boltdb-shipper-active
        cache_location: /data/loki/boltdb-shipper-cache
        cache_ttl: 24h
        shared_store: filesystem
      filesystem:
        directory: /data/loki/chunks

    # Chunk store configuration
    chunk_store_config:
      max_look_back_period: 0s

    # Table manager configuration
    table_manager:
      retention_deletes_enabled: true
      retention_period: 336h # 14 days

    # Compactor configuration
    compactor:
      working_directory: /data/loki/compactor
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

  # Persistence for Loki data
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi

  # Resources
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Service configuration
  service:
    type: ClusterIP
    port: 3100

  # Service Monitor for Prometheus
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

  # Replicas
  replicas: 1

# ============================================
# PROMTAIL CONFIGURATION
# ============================================
promtail:
  enabled: true

  # Promtail configuration
  config:
    # Loki server URL
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push
        tenant_id: 1

    # Server configuration
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    # Positions (where Promtail stores its read position)
    positions:
      filename: /tmp/positions.yaml

    # Target configuration
    target_config:
      sync_period: 10s

    # Scrape configurations
    scrape_configs:
      # Pod logs
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape local pods
          - source_labels:
              - __meta_kubernetes_pod_node_name
            action: keep
            regex: ${HOSTNAME}

          # Drop pods with annotation prometheus.io/scrape=false
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: drop
            regex: "false"

          # Add namespace label
          - source_labels:
              - __meta_kubernetes_pod_namespace
            target_label: namespace

          # Add pod name label
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          # Add container name label
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container

          # Add app label
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app

          # Add job label
          - replacement: $1
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: job

          # Set log path
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log

      # System logs
      - job_name: kubernetes-system
        static_configs:
          - targets:
              - localhost
            labels:
              job: varlogs
              __path__: /var/log/*.log

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Mount host paths for reading logs
  #extraVolumes:
  #  - name: varlog
  #    hostPath:
  #      path: /var/log
  #  - name: varlibdockercontainers
  #    hostPath:
  #      path: /var/lib/docker/containers

  #extraVolumeMounts:
  #  - name: varlog
  #    mountPath: /var/log
  #    readOnly: true
  #  - name: varlibdockercontainers
  #    mountPath: /var/lib/docker/containers
  #    readOnly: true

  # Service Monitor for Prometheus
  serviceMonitor:
    enabled: true
    interval: 30s

  # Tolerations to run on all nodes
  tolerations:
    - effect: NoSchedule
      operator: Exists

# ============================================
# GRAFANA INTEGRATION
# ============================================
grafana:
  enabled: false # We're using Grafana from kube-prometheus-stack
  sidecar:
    datasources:
      enabled: false

# ============================================
# OPTIONAL: FLUENT-BIT (alternative to Promtail)
# ============================================
fluent-bit:
  enabled: false

# ============================================
# OPTIONAL: LOGSTASH
# ============================================
logstash:
  enabled: false

# ============================================
# OPTIONAL: FILEBEAT
# ============================================
filebeat:
  enabled: false
