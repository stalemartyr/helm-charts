# PersistentVolume for Prometheus
# Apply with: kubectl apply -f prometheus-pv.yaml
# NFS Server: 192.168.254.10
# NFS Base Path: /CLUSTER

---
# PersistentVolume for Prometheus data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-pv
  labels:
    app: prometheus
    component: data
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.254.10
    path: /CLUSTER/prometheus

