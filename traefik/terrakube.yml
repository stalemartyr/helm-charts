# httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flower-httproute
  namespace: upclass-dev01
spec:
  parentRefs:
    ## check the gateway resource in traefik
    - name: traefik-gateway
      namespace: traefik
      kind: Gateway
  hostnames:
    - flower-traefik.laniakea.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: upclass-flower
          port: 5000
          namespace: upclass-dev01
