apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosign.key
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cosign.key
  data:
    - secretKey: cosign_key
      remoteRef:
        key: cosign
        property: cosign_key
