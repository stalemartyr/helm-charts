apiVersion: v1
kind: Pod
metadata:
  name: test-hardcoded-secrets
  namespace: default
  annotations:
    app.password: "supersecret123"
spec:
  containers:
    - name: app
      image: nginx
      env:
        - name: DB_PASSWORD
          value: "hardcoded-password-123"
        - name: API_TOKEN
          value: "abc123token"
        - name: APP_PORT
          value: "8080"
      args:
        - "--auth-secret=mysecretvalue"
