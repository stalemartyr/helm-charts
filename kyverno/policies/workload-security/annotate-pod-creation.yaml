apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-user-metadata
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    - name: has-username
      expression: "request.userInfo.username != ''"

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              annotations: {
                "kyverno.io/created-by":
                  request.userInfo.username
              }
            }
          }
